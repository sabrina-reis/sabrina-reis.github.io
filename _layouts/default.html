<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="masthead__rule"></div>
      <div class="masthead__row">
        <a class="masthead__name" href="{{ '/' | relative_url }}">Sabrina Reis</a>
        <nav class="masthead__nav">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-active"{% endif %}>About</a>
          <a href="{{ '/publications/' | relative_url }}"{% if page.url contains 'publications' %} class="is-active"{% endif %}>Publications</a>
        </nav>
      </div>
      <div class="masthead__rule masthead__rule--thin"></div>
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="footer">
      <div class="masthead__rule masthead__rule--thin"></div>
      <p>{{ site.title }} · Built with Jekyll</p>
    </footer>
  </div>
</body>
</html>
